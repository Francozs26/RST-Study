document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

a2a-b270-94ced39186aa\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6\">\n<header style=\"position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top));background:var(--sf);border-bottom:1px solid var(--ln)\">\n<sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ toggleNav }}\" aria-label=\"Menu\" style=\"min-width:44px;height:44px;border:1px solid var(--ln);background:var(--sf2);border-radius:10px;cursor:pointer;font-size:15px;font-weight:600\">Menu<\u002Fbutton>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1\">\n<span style=\"font-weight:700;font-size:16px\">JSE Registered Securities Trader<\u002Fspan>\n<span style=\"font-size:13px;color:var(--mu)\">{{ countdownText }}<\u002Fspan>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"min-height:44px;padding:0 14px;border:1px solid var(--ln);background:var(--sf2);border-radius:10px;cursor:pointer;font-size:15px;white-space:nowrap;flex-shrink:0\">{{ themeLabel }}<\u002Fbutton>\n<\u002Fheader>\n<div style=\"display:flex;align-items:flex-start\">\n<sc-if value=\"{{ navScrim }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ toggleNav }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:40\"><\u002Fdiv>\n<\u002Fsc-if>\n<nav style=\"{{ navStyle }}\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mu);padding:16px 12px 6px\">Overview<\u002Fdiv>\n<sc-for list=\"{{ navMain }}\" as=\"n\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton><\u002Fsc-for>\n<div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mu);padding:18px 12px 6px\">Topic tion:column;gap:10px\">\n<sc-for list=\"{{ topicRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ t.go }}\" style=\"text-align:left;cursor:pointer;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap\"><span style=\"font-weight:700;color:var(--ac)\">{{ t.id }}<\u002Fspan><span style=\"font-weight:600;font-size:18px\">{{ t.title }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px;font-size:15px\">\n<div><div style=\"color:var(--mu);font-size:13px\">Cards reviewed<\u002Fdiv>{{ t.reviewed }}<\u002Fdiv>\n<div><div style=\"color:var(--mu);font-size:13px\">Needs review<\u002Fdiv>{{ t.need }}<\u002Fdiv>\n<div><div style=\"color:var(--mu);font-size:13px\">Best quiz<\u002Fdiv>{{ t.best }}<\u002Fdiv>\n<div><div style=\"color:var(--mu);font-size:13px\">Last attempt<\u002Fdiv>{{ t.last }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:6px;border-radius:3px;background:var(--sf2);overflow:hidden\"><div style=\"{{ t.bar }}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"font-size:14px;color:var(--mu);margin:12px 0 30px\">Readiness per topic = half the share of flashcards marked reviewed, plus half the best quiz score. Overall = the average of the 4 topics.<\u002Fp>\n<h2 style=\"font-size:20px;margin:0 0 12px\">Settings<\u002Fh2>\n<div style=\"background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px\">\n<label style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"flex:1;min-width:160px\">Pass mark (%)<\u002Fspan><input type=\"number\" min=\"1\" max=\"100\" value=\"{{ passMark }}\" sc-camel-on-change=\"{{ setPass }}\" style=\"width:96px;min-height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)\"><\u002Flabel>\n<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"flex:1;min-width:160px\">Exam format<\u002Fspan><span style=\"color:var(--mu)\">50 questions · 1 hour · no negative marking<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"flex:1;min-width:160px\">Clear progress, highlights, notes and plan from this device<\u002Fspan><button sc-camel-on-click=\"{{ resetAll }}\" style=\"min-height:44px;padding:0 16px;border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:10px;cursor:pointer;font-weight:600\">Reset all progress<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font-size:30px;line-height:1.2;margin:4px 0 16px\">Study plan<\u002Fh1>\n<div style=\"background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px\">\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)\">Start date<input type=\"date\" value=\"{{ planStart }}\" sc-camel-on-change=\"{{ setStart }}\" style=\"min-height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);font-size:16px\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)\">Exam date<input type=\"date\" value=\"{{ planExam }}\" sc-camel-on-change=\"{{ setExam }}\" style=\"min-height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);font-size:16px\"><\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:14px;color:var(--mu)\">Days off<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ offDays }}\" as=\"d\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ d.toggle }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px\"><span><strong>{{ planDone }}<\u002Fstrong> of {{ planTotal }} tasks done ({{ planPct }}%)<\u002Fspan><span style=\"color:var(--mu)\">{{ planSummary }}<\u002Fspan><sc-if value=\"{{ hasToday }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ jumpToday }}\" style=\"min-height:40px;padding:0 14px;border:1px solid var(--ac);color:var(--ac);background:transparent;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap\">Go to today<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<div style=\"height:6px;border-radius:3px;background:var(--sf2);overflow:hidden\"><div style=\"{{ planBar }}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ planWarnings }}\" as=\"w\" hint-placeholder-count=\"0\"><div style=\"background:var(--flagbg);border:1px solid var(--flagln);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:15px\"><strong>Warning.<\u002Fstrong> {{ w }}<\u002Fdiv><\u002Fsc-for>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<sc-for list=\"{{ planDays }}\" as=\"day\" hint-placeholder-count=\"3\">\n<section id=\"{{ day.anchor }}\" style=\"{{ day.style }}\">\n<div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px\"><span style=\"font-weight:700;font-size:17px\">{{ day.label }}<\u002Fspan><span style=\"font-size:13px;color:var(--mu)\">{{ day.kind }}<\u002Fspan><sc-if value=\"{{ day.isToday }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;font-weight:700;background:var(--ac);color:var(--sf);border-radius:999px;padding:2px 10px\">TODAY<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px\">\n<div><div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mu);margin-bottom:4px\">Morning<\u002Fdiv>\n<sc-for list=\"{{ day.morning }}\" as=\"tk\" hint-placeholder-count=\"1\">\n<div style=\"display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--ln)\">\n<button sc-camel-on-click=\"{{ tk.toggle }}\" aria-label=\"Tick\" style=\"{{ tk.box }}\">{{ tk.mark }}<\u002Fbutton>\n<sc-if value=\"{{ tk.hasLink }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ tk.go }}\" style=\"{{ tk.text }}\">{{ tk.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ tk.noLink }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tk.text }}\">{{ tk.label }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ tk.custom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ tk.remove }}\" aria-label=\"Remove task\" style=\"min-width:44px;min-height:44px;border:none;background:transparent;color:var(--mu);cursor:pointer;font-size:14px\">Remove<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for><\u002Fdiv>\n<div><div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--mu);margin-bottom:4px\">Evening<\u002Fdiv>\n<sc-for list=\"{{ day.evening }}\" as=\"tk\" hint-placeholder-count=\"1\">\n<div style=\"display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--ln)\">\n<button sc-camel-on-click=\"{{ tk.toggle }}\" aria-label=\"Tick\" style=\"{{ tk.box }}\">{{ tk.mark }}<\u002Fbutton>\n<sc-if value=\"{{ tk.hasLink }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ tk.go }}\" style=\"{{ tk.text }}\">{{ tk.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ tk.noLink }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tk.text }}\">{{ tk.label }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ tk.custom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ tk.remove }}\" aria-label=\"Remove task\" style=\"min-width:44px;min-height:44px;border:none;background:transparent;color:var(--mu);cursor:pointer;font-size:14px\">Remove<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ day.adding }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\">\n<input value=\"{{ addText }}\" sc-camel-on-change=\"{{ setAddText }}\" placeholder=\"Your task\" style=\"flex:1 1 200px;min-height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)\">\n<button sc-camel-on-click=\"{{ day.addM }}\" style=\"min-height:44px;padding:0 12px;border:1px solid var(--ln);background:var(--sf2);border-radius:8px;cursor:pointer\">Add to morning<\u002Fbutton>\n<button sc-camel-on-click=\"{{ day.addE }}\" style=\"min-height:44px;padding:0 12px;border:1px solid var(--ln);background:var(--sf2);border-radius:8px;cursor:pointer\">Add to evening<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ day.notAdding }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ day.startAdd }}\" style=\"margin-top:8px;min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--ac);cursor:pointer;font-weight:600;font-size:15px\">+ Add task<\u002Fbutton><\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMock }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{ mockStart }}\" hint-placeholder-val=\"{{ true }}\">\n<h1 style=\"font-size:30px;line-height:1.2;margin:4px 0 12px\">Mock exam<\u002Fh1>\n<div style=\"background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-weight:600;font-size:18px\">Randomised paper<\u002Fdiv>\n<ul style=\"margin:0;padding-left:20px\"><li>50 questions spread evenly across the 4 topics (13, 13, 12, 12), drawn from the topic pools.<\u002Fli><li>60 minute countdown. The paper submits itself when time runs out.<\u002Fli><li>No feedback until you submit. Pass mark: {{ pass nnerWidth, hlOn: false, hlColor: 0, notesOpen: false, deck: 'all', cardIdx: 0, flipped: false, order: null, quiz: null, now: Date.now(), adding: null, addText: '', wrongOnly: false, v: 0 };\n    this.learnEl = null; this.painted = '';\n    this.learnRef = el => {\n      if (this.learnEl && this.learnEl !== el) this.detach(this.learnEl);\n      this.learnEl = el; this.painted = '';\n      if (el) { this.attach(el); this.paint(); }\n    };\n  }\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    this.applyTheme();\n    this.tick = setInterval(() => {\n      const m = this.db.activeMock;\n      if (m && !m.done) { if (Date.now() >= m.end) this.submitMock(); else this.setState({ now: Date.now() }); }\n    }, 1000);\n    const wait = () => { if (window.STUDY && STUDY.topics && this.topics().length >= 4 && STUDY.ref) { this.forceUpdate(); this.paint(); } else setTimeout(wait, 50); };\n    wait();\n    this.selDeb = null;\n    this.onSel = () => {\n      if (!this.state.hlOn || !this.learnEl) return;\n      clearTimeout(this.selDeb);\n      this.selDeb = setTimeout(() => this.applySelection(), 900);\n    };\n    document.addEventListener('selectionchange', this.onSel);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearInterval(this.tick); document.removeEventListener('selectionchange', this.onSel); }\n  componentDidUpdate() {\n    this.applyTheme(); this.paint();\n    if (this.pendingSec) { const el = document.getElementById(this.pendingSec); if (el) { window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 130 }); this.pendingSec = null; } }\n    if (this.pendingTop) { window.scrollTo({ top: 0 }); this.pendingTop = false; }\n  }\n  applyTheme() {\n    document.documentElement.setAttribute('data-theme', this.db.theme);\n    const m = document.querySelector('meta[name=\"theme-color\"]'); if (m) m.setAttribute('content', this.db.theme === 'dark' ? '#1d1c1a' : '#f6f5f2');\n  }\n  save() { try { localStorage.setItem(KEY, JSON.stringify(this.db)); } catch (e) {} this.setState(s => ({ v: s.v + 1 })); }\n  topics() { if (!(window.STUDY && STUDY.topics)) return []; const seen = {}; return STUDY.topics.filter(t => seen[t.id] ? false : (seen[t.id] = 1)).sort((a,b) => a.id < b.id ? -1 : 1); }\n  T(id) { return this.topics().find(t => t.id === id); }\n  go(view, extra) { this.pendingTop = !(extra && extra.sec); if (extra && extra.sec) this.pendingSec = extra.sec; this.setState(Object.assign({ view, navOpen: false, hlOn: view === 'topic' ? this.state.hlOn : false }, extra || {}, { sec: undefined })); }\n  goTopic(id, tab, sec) {\n    const ch = id !== this.state.topic;\n    this.go('topic', Object.assign({ topic: id, tab: tab || 'learn', sec }, ch ? { cardIdx: 0, flipped: false, order: null, quiz: null, hlOn: false } : {}, tab === 'quiz' && this.state.quiz && this.state.quiz.done ? { quiz: null } : {}));\n  }\n\n  /* ---------- Learn rendering + highlighter ---------- */\n  buildLearn(t) {\n    let h = '', sec = 0;\n    t.learn.forEach((b, i) => {\n      if (b.h) { h += `<h2 id=\"sec-${t.id}-${sec++}\" style=\"font-size:22px;line-height:1.3;margin:38px 0 2px\">${esc(b.h)}<\u002Fh2>` + (b.src ? `<div style=\"font-size:13px;color:var(--mu);margin-bottom:14px\">Source: ${esc(b.src)}<\u002Fdiv>` : ''); }\n      else if (b.p) h += `<p data-b=\"${i}\" style=\"margin:0 0 14px;text-wrap:pretty\">${esc(b.p)}<\u002Fp>`;\n      else if (b.defs) h += `<div style=\"margin:0 0 20px;border-top:1px solid var(--ln)\">` + b.defs.map((d, j) => `<div style=\"display:flex;flex-wrap:wrap;gap:2px 22px;padding:10px 0;border-bottom:1px solid var(--ln)\"><div data-b=\"${i}.${j}.0\" style=\"flex:0 1 210px;font-weight:650;min-width:0\">${esc(d[0])}<\u002Fdiv><div data-b=\"${i}.${j}.1\" style=\"flex:1 1 280px;min-width:0\">${esc(d[1])}<\u002Fdiv><\u002Fdiv>`).join('') + `<\u002Fdiv>`;\n      else if (b.ol || b.ul) { const tag = b.ol ? 'ol' : 'ul'; h += `<${tag} style=\"margin:0 0 18px;padding-left:26px\">` + (b.ol || b.ul).map((x, j) => `<li data-b=\"${i}.${j}\" style=\"margin:0 0 8px;padding-left:4px\">${esc(x)}<\u002Fli>`).join('') + `<\u002F${tag}>`; }\n      else if (b.table) h += `<div style=\"overflow-x:auto;margin:0 0 20px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)\"><table style=\"width:100%;border-collapse:collapse;font-size:15px;line-height:1.45\"><thead><tr>` + b.table.head.map(x => `<th style=\"text-align:left;padding:9px 12px;background:var(--sf2);border-bottom:2px solid var(--ln);font-size:14px\">${esc(x)}<\u002Fth>`).join('') + `<\u002Ftr><\u002Fthead><tbody>` + b.table.rows.map((r, j) => `<tr>` + r.map((c, k) => `<td data-b=\"${i}.${j}.${k}\" style=\"padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:top;min-width:80px\">${esc(c)}<\u002Ftd>`).join('') + `<\u002Ftr>`).join('') + `<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n      else if (b.flag) h += `<div style=\"background:var(--flagbg);border:1px solid var(--flagln);border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:16px\"><div style=\"font-weight:700;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px\">Flag<\u002Fdiv><div data-b=\"${i}\">${esc(b.flag)}<\u002Fdiv><\u002Fdiv>`;\n      else if (b.placeholder) h += `<div style=\"border:2px dashed var(--ln);border-radius:10px;padding:16px;margin:0 0 18px;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--sf2) 10px 20px)\"><div style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;margin-bottom:4px\">PLACEHOLDER · IMAGE TABLE<\u002Fdiv><div data-b=\"${i}\" style=\"font-size:15px\">${esc(b.placeholder)}<\u002Fdiv><\u002Fdiv>`;\n    });\n    h += `<h2 id=\"sec-${t.id}-${sec}\" style=\"font-size:22px;line-height:1.3;margin:40px 0 10px\">Boundary cases<\u002Fh2><div style=\"background:var(--sf);border:2px solid var(--ac);border-radius:12px;padding:6px 16px 4px\">` + t.boundary.map((d, j) => `<div style=\"display:flex;flex-wrap:wrap;gap:2px 22px;padding:10px 0;${j ? 'border-top:1px solid var(--ln)' : ''}\"><div data-b=\"bd.${j}.0\" style=\"flex:0 1 210px;font-weight:650;min-width:0\">${esc(d[0])}<\u002Fdiv><div data-b=\"bd.${j}.1\" style=\"flex:1 1 280px;min-width:0\">${esc(d[1])}<\u002Fdiv><\u002Fdiv>`).join('') + `<\u002Fdiv>`;\n    return h;\n  }\n  paint() {\n    const el = this.learnEl; if (!el || this.state.view !== 'topic' || this.state.tab !== 'learn') return;\n    const t = this.T(this.state.topic); if (!t) return;\n    const key = t.id + '|' + (this.hlVer || 0);\n    if (this.painted === key) return;\n    this.painted = key;\n    el.innerHTML = this.buildLearn(t);\n    (this.db.hl[t.id] || []).forEach(x => this.wrap(el, x));\n  }\n  texts(leaf) { const w = document.createTreeWalker(leaf, NodeFilter.SHOW_TEXT); const a = []; let n; while ((n = w.nextNode())) a.push(n); return a; }\n  wrap(root, x) {\n    const leaf = root.querySelector(`[data-b=\"${x.b}\"]`); if (!leaf) return;\n    let pos = 0;\n    this.texts(leaf).forEach(n => {\n      const len = n.nodeValue.length, ns = pos, ne = pos + len; pos = ne;\n      const s = Math.max(x.s, ns), e = Math.min(x.e, ne); if (e <= s) return;\n      let node = n; if (s > ns) node = node.splitText(s - ns); if (e < ne) node.splitText(e - s);\n      const m = document.createElement('mark'); m.setAttribute('data-hl', x.id);\n      m.style.cssText = `background:${HL[x.c] ? HL[x.c][1] : HL[0][1]};color:#fff;border-radius:3px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone`;\n      node.parentNode.insertBefore(m, node); m.appendChild(node);\n    });\n  }\n  offsetIn(leaf, node, off) {\n    if (node.nodeType !== 3) { const kids = node.childNodes; let p = 0; const a = this.texts(leaf); const before = []; for (let i = 0; i < off && i < kids.length; i++) before.push(kids[i]); before.forEach(k => { p += (k.textContent || '').length; }); const r = document.createRange(); r.setStart(leaf, 0); r.setEnd(node, off); return r.toString().length; }\n    let p = 0; for (const n of this.texts(leaf)) { if (n === node) return p + off; p += n.nodeValue.length; } return p;\n  }\n  addHl(items) {\n    const tid = this.state.topic; const list = (this.db.hl[tid] || []).slice(); const erase = this.state.hlColor === 7;\n    let out = list;\n    items.forEach(it => {\n      out = out.filter(x => !(x.b === it.b && x.s < it.e && x.e > it.s));\n      if (!erase) out.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), b: it.b, s: it.s, e: it.e, c: this.state.hlColor });\n    });\n    this.db.hl[tid] = out; this.hlVer = (this.hlVer || 0) + 1; this.save();\n  }\n  applySelection() {\n    const el = this.learnEl; const sel = window.getSelection(); if (!el || !sel || sel.isCollapsed || !sel.rangeCount) return false;\n    const r = sel.getRangeAt(0); if (!el.contains(r.commonAncestorContainer)) return false;\n    const items = [];\n    el.querySelectorAll('[data-b]').forEach(leaf => {\n      if (!r.intersectsNode(leaf)) return;\n      const len = leaf.textContent.length;\n      const s = leaf.contains(r.startContainer) ? this.offsetIn(leaf, r.startContainer, r.startOffset) : 0;\n      const e = leaf.contains(r.endContainer) ? this.offsetIn(leaf, r.endContainer, r.endOffset) : len;\n      if (e > s) items.push({ b: leaf.getAttribute('data-b'), s, e });\n    });\n    sel.removeAllRanges();\n    if (items.length) { this.justApplied = Date.now(); this.addHl(items); return true; }\n    return false;\n  }\n  attach(el) {\n    this.h_up = () => { if (this.state.hlOn) setTimeout(() => this.applySelection(), 20); };\n    this.h_click = ev => {\n      if (!this.state.hlOn) return;\n      if (this.justApplied && Date.now() - this.justApplied < 400) return;\n      const sel = window.getSelection(); if (sel && !sel.isCollapsed) return;\n      const mk = ev.target.closest && ev.target.closest('mark[data-hl]');\n      const tid = this.state.topic;\n      if (mk) {\n        const id = mk.getAttribute('data-hl'); const list = this.db.hl[tid] || []; const x = list.find(h => h.id === id); if (!x) return;\n        if (this.state.hlColor === 7 || x.c === this.state.hlColor) this.db.hl[tid] = list.filter(h => h.id !== id);\n        else x.c = this.state.hlColor;\n        this.hlVer = (this.hlVer || 0) + 1; this.save(); return;\n      }\n      let node, off;\n      if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(ev.clientX, ev.clientY); if (r) { node = r.startContainer; off = r.startOffset; } }\n      else if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(ev.clientX, ev.clientY); if (p) { node = p.offsetNode; off = p.offset; } }\n      if (!node) return;\n      const leaf = (node.nodeType === 3 ? node.parentNode : node).closest('[data-b]'); if (!leaf || !el.contains(leaf)) return;\n      const txt = leaf.textContent; const o = this.offsetIn(leaf, node, off);\n      let s = o, e = o; const wc = /[\\w\\u00C0-\\u024F%'’.\\-–]/;\n      while (s > 0 && wc.test(txt[s - 1])) s--; while (e < txt.length && wc.test(txt[e])) e++;\n      while (e > s && /[.\\-–]/.test(txt[e - 1])) e--;\n      if (e > s) this.addHl([{ b: leaf.getAttribute('data-b'), s, e }]);\n    };\n    el.addEventListener('mouseup', this.h_up); el.addEventListener('touchend', this.h_up); el.addEventListener('click', this.h_click);\n  }\n  detach(el) { el.removeEventListener('mouseup', this.h_up); el.removeEventListener('touchend', this.h_up); el.removeEventListener('click', this.h_click); }\n\n  /* ---------- Quiz / mock ---------- */\n  prep(q, tid) {\n    const idx = shuffle([0, 1, 2, 3]);\n    return { tid, q: q[0], opts: idx.map(i => q[1][i]), a: idx.indexOf(q[2]), why: q[3], w: idx.map(i => q[4][i]), h: q[5] };\n  }\n  startQuiz() { const t = this.T(this.state.topic); this.setState({ quiz: { items: shuffle(t.quiz).map(q => this.prep(q, t.id)), i: 0, chosen: null, hint: false, sc
